<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talent Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f9;--ink:#0f172a;--ink2:#475569;--muted:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--accent:#2563eb;--danger:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit}
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;height:100vh;overflow:hidden}

/* Sidebar */
#sidebar{background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;padding:16px 12px;gap:10px;min-height:0}
.brand{font-weight:700;font-size:16px;padding:2px 6px 6px;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
#mapList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.map-item{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.map-item:hover{background:#1e293b}
.map-item.on{background:#1e3a8a}
.map-item .t{flex:1;min-width:0}
.map-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.map-item .sub{font-size:11.5px;color:#94a3b8}
.mi-acts{display:none;gap:2px}
.map-item:hover .mi-acts{display:flex}
.mi-acts button{background:none;border:0;color:#94a3b8;cursor:pointer;padding:3px 6px;border-radius:5px;font-size:11.5px}
.mi-acts button:hover{background:#334155;color:#fff}
.side-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid #1e293b;padding-top:10px}
#saveState{font-size:11.5px;color:#94a3b8;padding:2px 4px}

/* Buttons */
.btn{font-size:13px;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#f1f5f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.block{width:100%}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default;background:#fff}
#sidebar .btn{background:#1e293b;border-color:#334155;color:#e2e8f0}
#sidebar .btn:hover{background:#273449}
#sidebar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--ink2);padding:6px 8px;border-radius:6px;font-size:15px;line-height:1}
.icon-btn:hover{background:#f1f5f9}

/* Main */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
#toggleSide{display:none}
.map-name{font:inherit;font-size:17px;font-weight:650;border:1px solid transparent;border-radius:8px;padding:5px 8px;width:280px;min-width:80px;background:transparent;color:var(--ink)}
.map-name:hover{border-color:var(--line)}
.map-name:focus{outline:none;border-color:var(--accent)}
.search{font:inherit;font-size:13px;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;width:190px}
.search:focus{outline:none;border-color:var(--accent)}
.spacer{flex:1}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.15);padding:6px;display:none;z-index:40;min-width:200px}
.menu-pop.open{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.menu-pop button:hover{background:#f1f5f9}
.menu-pop small{display:block;color:var(--muted);font-size:11.5px}

#legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
#legend:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:#fff;cursor:pointer;color:var(--ink2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);color:var(--ink)}

/* Canvas */
#viewport{position:relative;flex:1;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(#d3d9e2 1px,transparent 1px);background-size:20px 20px;cursor:grab;touch-action:none}
#viewport.panning{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:#94a3b8;stroke-width:1.5}
.card{position:absolute;width:208px;height:92px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px 8px 18px;box-shadow:0 1px 2px rgba(15,23,42,.06);cursor:pointer;user-select:none;-webkit-user-select:none;transition:box-shadow .15s,opacity .15s}
.card:hover{box-shadow:0 4px 14px rgba(15,23,42,.12)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.card.drop{border-color:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.35)}
.card.dragging{opacity:.85;z-index:20;box-shadow:0 12px 30px rgba(15,23,42,.25);cursor:grabbing;transition:none}
.card.dim{opacity:.28}
.card.dupe{border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.4);opacity:1}
.dup{border-radius:10px;padding:8px 10px;margin:-4px 0 12px;font-size:12.5px}
.dup.warn{background:#fffbeb;border:1px solid #fcd34d}
.dup.soft{background:#f8fafc;border:1px solid var(--line)}
.dup-h{font-weight:650;font-size:11px;color:#92400e;margin:2px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.dup.soft .dup-h{color:var(--muted)}
.dup-row + .dup-h,.dup-sep + .dup-row{margin-top:8px}
.dup-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.dup-t{flex:1;min-width:0;display:flex;flex-direction:column}
.dup-t b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dup-t span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dup-sep{height:1px;background:#fde68a;margin:4px 0}
.dup-more{font-size:11.5px;color:var(--muted);padding-top:2px}
.card .strip{position:absolute;left:7px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--sc)}
.card .nm{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tt{font-size:11.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:14px;max-height:28px;margin-top:2px}
.card .ft{position:absolute;left:18px;right:10px;bottom:7px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);height:16px}
.card .loc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sb);color:var(--sc);white-space:nowrap}
.card .lnk{color:var(--accent);text-decoration:none;font-weight:700;font-size:11px;padding:0 3px;border-radius:4px}
.card .lnk:hover{background:#eff6ff}
.ph{color:#b6c0cd;font-weight:400}
.card .acts{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);display:none;gap:4px;z-index:3}
.card:hover .acts,.card.sel .acts{display:flex}
.card.dragging .acts{display:none}
.acts button{font-size:11px;font-weight:600;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap}
.acts button:hover{background:var(--accent);color:#fff}
.tog{position:absolute;right:8px;bottom:-11px;min-width:22px;height:20px;padding:0 6px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-size:11px;font-weight:600;cursor:pointer;z-index:2}
.tog:hover{border-color:var(--accent);color:var(--accent)}
.card.team{background:#1e293b;border-color:#1e293b;color:#fff;text-align:center;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.card.team .nm{font-size:14px}
.card.team .tt{color:#cbd5e1}
.card.team .ph{color:#64748b}
.card.team .ft,.card.team .strip{display:none}

.zoom{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px rgba(15,23,42,.08);overflow:hidden}
.zoom button{border:0;background:none;padding:7px 11px;cursor:pointer;font-size:14px;color:var(--ink2)}
.zoom button:hover{background:#f1f5f9}
.zoom span{font-size:12px;color:var(--muted);min-width:44px;text-align:center}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#empty.show{display:flex}
#empty .box{pointer-events:auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 32px;box-shadow:0 4px 20px rgba(15,23,42,.06);max-width:360px}
#empty h3{margin:0 0 6px;font-size:16px}
#empty p{margin:0 0 16px;color:var(--muted);font-size:13px}
#empty .row{display:flex;gap:8px;justify-content:center}

/* Panel */
#panel{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:16px;min-height:0}
.p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.p-title{font-weight:650;font-size:15px}
.seg{display:flex;background:#f1f5f9;border-radius:8px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.1)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.fld textarea{width:100%;font:inherit;font-size:13.5px;line-height:1.45;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);resize:vertical;min-height:84px}
.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.note-ic{position:absolute;top:9px;right:9px;color:#64748b;display:flex;cursor:help}
.card.team .note-ic{color:#94a3b8}
.note-ic.in-tray{position:static;margin-top:3px;flex:none}
.fld input,.fld select{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.fld .row{display:flex;gap:6px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.schip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px;color:var(--ink2);text-align:left}
.schip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.schip.on{border-color:var(--c);background:var(--b);color:var(--ink);font-weight:600}
.btn-row{display:flex;gap:6px;margin-bottom:8px}
.btn-row .btn{flex:1}
.divider{height:1px;background:var(--line);margin:14px 0}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.keys{font-size:12.5px;color:var(--ink2);margin:0;padding:0;list-style:none}
.keys li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f1f5f9;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#92400e;margin-top:14px}

/* Unplaced tray */
#tray{position:absolute;left:12px;top:12px;bottom:12px;width:232px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(15,23,42,.08);display:flex;flex-direction:column;z-index:5;cursor:default;transition:box-shadow .15s,border-color .15s}
#tray.closed{bottom:auto;width:auto}
#tray.closed #trayList,#tray.closed .tray-hint,#tray.closed #trayAdd{display:none}
#tray.drop{border-color:#d97706;box-shadow:0 0 0 4px rgba(217,119,6,.3)}
.tray-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line)}
#tray.closed .tray-head{border-bottom:0}
#trayToggle{flex:1;border:0;background:none;font-weight:650;font-size:13px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px;padding:2px 0;color:var(--ink)}
#trayToggle .chev{color:var(--muted);font-size:10px}
.count{background:#f1f5f9;border-radius:999px;padding:0 7px;font-size:11.5px;color:var(--ink2);font-weight:600}
.count.has{background:#fef3c7;color:#92400e}
#trayList{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.titem{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;background:#fff;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.titem:hover{border-color:#94a3b8}
.titem.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.2)}
.titem.dim{opacity:.3}
.titem.dupe{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.4);opacity:1}
.titem i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--c)}
.titem>div{min-width:0;flex:1}
.titem .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem.ghost{position:fixed;z-index:100;pointer-events:none;width:210px;box-shadow:0 10px 30px rgba(15,23,42,.25);opacity:.95}
.titem.src{opacity:.35}
.tray-empty{font-size:12px;color:var(--muted);padding:6px 4px;line-height:1.45}
.tray-hint{font-size:11px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);line-height:1.4}
#viewport.over-bg{box-shadow:inset 0 0 0 3px rgba(37,99,235,.25)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:#93c5fd;font-weight:600;cursor:pointer;padding:0}
#scrim{display:none}

@media (max-width:1000px){
  #app{grid-template-columns:minmax(0,1fr)}
  #toggleSide{display:block}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  #app.side-open #sidebar{transform:none}
  #app.side-open #scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:45}
  #panel{position:fixed;right:0;top:0;bottom:0;width:min(320px,92vw);z-index:40;transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 24px rgba(15,23,42,.12)}
  #app.panel-open #panel{transform:none}
  .map-name{width:auto;flex:1}
  .search{width:110px}
  #undoBtn,#redoBtn,#addRoot{display:none}
  #topbar{gap:6px;padding:8px 10px}
  .map-name{font-size:15px;min-width:0}
  .search{width:96px;flex:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="scrim"></div>
  <aside id="sidebar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="7" y="1.5" width="6" height="5" rx="1.2" fill="#60a5fa"/><rect x="1" y="13.5" width="6" height="5" rx="1.2" fill="#93c5fd"/><rect x="13" y="13.5" width="6" height="5" rx="1.2" fill="#93c5fd"/><path d="M10 6.5V10M4 13.5V10h12v3.5" stroke="#94a3b8" stroke-width="1.4"/></svg>
      Talent Map
    </div>
    <button id="newMap" class="btn primary block">+ New map</button>
    <div id="mapList"></div>
    <div class="side-foot">
      <button id="backupBtn" class="btn block" title="Download every map as one .json file">Save backup (.json)</button>
      <button id="restoreBtn" class="btn block" title="Load maps from a backup file">Open backup…</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
      <div id="saveState"></div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="toggleSide" class="icon-btn" title="Maps">&#9776;</button>
      <input id="mapName" class="map-name" placeholder="Company / team name" spellcheck="false">
      <input id="search" class="search" type="search" placeholder="Search people…">
      <div class="spacer"></div>
      <button class="btn" id="addRoot" title="Add a top-level box">+ Add box</button>
      <button class="btn" id="undoBtn" title="Undo (⌘Z)">Undo</button>
      <button class="btn" id="redoBtn" title="Redo (⇧⌘Z)">Redo</button>
      <div class="menu">
        <button class="btn primary" id="exportBtn">Export &#9662;</button>
        <div class="menu-pop" id="exportMenu">
          <button data-ex="pdf">PDF<small>Print-ready, profile links clickable</small></button>
          <button data-ex="png">PNG image<small>For slides and emails</small></button>
          <button data-ex="csv">CSV list<small>Everyone on the map, for spreadsheets</small></button>
        </div>
      </div>
    </header>
    <div id="legend"></div>
    <div id="viewport">
      <div id="stage"><svg id="edges"></svg><div id="cards"></div></div>
      <div id="tray">
        <div class="tray-head">
          <button id="trayToggle" title="Show / hide unplaced people"><span class="chev">&#9660;</span>Unplaced <span class="count" id="trayCount">0</span></button>
          <button class="btn sm" id="trayAdd" title="Add someone you haven't placed yet">+ Add</button>
        </div>
        <div id="trayList"></div>      </div>
      <div id="empty"><div class="box">
        <h3>Start mapping this team</h3>
        <p>Add the most senior person you know of, then branch out with their reports.</p>
        <div class="row"><button class="btn primary" data-empty="person">+ Add first person</button><button class="btn" data-empty="team">+ Team box</button></div>
      </div></div>
      <div class="zoom">
        <button id="zOut" title="Zoom out">&minus;</button><span id="zLbl">100%</span><button id="zIn" title="Zoom in">+</button><button id="zFit" title="Fit to screen (F)">Fit</button>
      </div>
    </div>
  </main>

  <aside id="panel"></aside>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ---------- Constants ---------- */
const KEY = 'talentmap.v1';
const STATUSES = [
  { k: '',          label: 'No status',      c: '#94a3b8', bg: '#f1f5f9' },
  { k: 'target',    label: 'Target',         c: '#2563eb', bg: '#dbeafe' },
  { k: 'contacted', label: 'Contacted',      c: '#7c3aed', bg: '#ede9fe' },
  { k: 'process',   label: 'In process',     c: '#d97706', bg: '#fef3c7' },
  { k: 'placed',    label: 'Placed',         c: '#16a34a', bg: '#dcfce7' },
  { k: 'declined',  label: 'Not interested', c: '#dc2626', bg: '#fee2e2' },
  { k: 'open',      label: 'Open role',      c: '#0891b2', bg: '#cffafe' },
];
const SMAP = Object.fromEntries(STATUSES.map(s => [s.k, s]));
const W = 208, H = 92, HG = 22, VG = 56, RG = 64;

const $ = s => document.querySelector(s);
const app = $('#app'), vp = $('#viewport'), stage = $('#stage'), cardsEl = $('#cards'),
      edgesEl = $('#edges'), panel = $('#panel'), toastEl = $('#toast');

/* ---------- State ---------- */
let state = load();
let sel = null;
let view = { x: 40, y: 40, k: 1 };
const views = {};
let filterStatus = null, query = '';
let undoStack = [], redoStack = [];
let editSnap = false;
let lastLayout = null;

function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function str(v) { return typeof v === 'string' ? v : (v == null ? '' : String(v)); }
function esc(s) { return str(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function normUrl(u) {
  u = str(u).trim(); if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}
function newNode(o) { return Object.assign({ id: uid(), parentId: null, type: 'person', name: '', title: '', location: '', url: '', status: '', notes: '', collapsed: false, unplaced: false }, o); }

function cleanMap(m) {
  const out = { id: str(m.id) || uid(), name: str(m.name) || 'Untitled map', createdAt: +m.createdAt || Date.now(), updatedAt: +m.updatedAt || Date.now(), nodes: [] };
  const seen = new Set();
  for (const n of (Array.isArray(m.nodes) ? m.nodes : [])) {
    if (!n || typeof n !== 'object') continue;
    let id = str(n.id) || uid(); if (seen.has(id)) id = uid(); seen.add(id);
    out.nodes.push(newNode({ id, parentId: n.parentId ? str(n.parentId) : null, type: n.type === 'team' ? 'team' : 'person',
      name: str(n.name), title: str(n.title), location: str(n.location), url: str(n.url),
      status: SMAP[n.status] ? n.status : '', notes: str(n.notes), collapsed: !!n.collapsed, unplaced: !!n.unplaced }));
  }
  const byId = new Map(out.nodes.map(n => [n.id, n]));
  for (const n of out.nodes) {
    if (n.unplaced) { n.parentId = null; continue; }
    if (n.parentId && (!byId.has(n.parentId) || byId.get(n.parentId).unplaced)) { n.parentId = null; continue; }
    const seenP = new Set(); let p = n.parentId;
    while (p) { if (p === n.id) { n.parentId = null; break; } if (seenP.has(p)) break; seenP.add(p); p = byId.get(p)?.parentId; }
  }
  return out;
}

  add({ parentId: plat.id, name: 'Open: Staff Engineer', title: 'Backend / distributed systems', location: 'Remote (EU)', status: 'open' });
  add({ parentId: vp1.id, name: 'Lena Ortiz', title: 'Head of Data', location: 'London' });
  add({ parentId: cto.id, name: 'Sam Lee', title: 'Director of Product', location: 'New York', status: 'declined' });

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.maps) && s.maps.length) {
      s.maps = s.maps.map(cleanMap);
      if (!s.maps.some(m => m.id === s.currentId)) s.currentId = s.maps[0].id;
      return s;
    }
  } catch (e) {}
  return sample();
}

let saveT = null;
function save() {
  clearTimeout(saveT); saveT = null;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    setSaved('Saved in this browser · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  } catch (e) { setSaved('⚠ Could not save in this browser — use Save backup'); }
}
function queueSave() { cur().updatedAt = Date.now(); clearTimeout(saveT); saveT = setTimeout(() => { save(); renderSidebar(); }, 400); setSaved('Saving…'); }
function setSaved(t) { $('#saveState').textContent = t; }
window.addEventListener('beforeunload', () => { if (saveT) save(); });

function cur() { return state.maps.find(m => m.id === state.currentId) || state.maps[0]; }
function node(id) { return cur().nodes.find(n => n.id === id); }

/* ---------- Undo ---------- */
function snap() { undoStack.push(JSON.stringify(cur().nodes)); if (undoStack.length > 100) undoStack.shift(); redoStack = []; updUndo(); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(cur().nodes)); cur().nodes = JSON.parse(undoStack.pop()); afterHistory(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(cur().nodes)); cur().nodes = JSON.parse(redoStack.pop()); afterHistory(); }
function afterHistory() { if (sel && !node(sel)) sel = null; commit(); }
function updUndo() { $('#undoBtn').disabled = !undoStack.length; $('#redoBtn').disabled = !redoStack.length; }

function commit() { cur().updatedAt = Date.now(); save(); render(); }

/* ---------- Layout ---------- */
function layout(map, all) {
  const placed = map.nodes.filter(n => !n.unplaced);
  const ids = new Set(placed.map(n => n.id));
  const kids = {}, roots = [];
  for (const n of placed) {
    if (n.parentId && ids.has(n.parentId) && n.parentId !== n.id) (kids[n.parentId] = kids[n.parentId] || []).push(n);
    else roots.push(n);
  }
  const vis = n => (all || !n.collapsed) ? (kids[n.id] || []) : [];
  const wid = {}, pos = {}, edges = [], order = [], depth = {};
  const width = n => {
    const ch = vis(n); let w = W;
    if (ch.length) w = Math.max(W, ch.reduce((a, c) => a + width(c), 0) + HG * (ch.length - 1));
    return (wid[n.id] = w);
  };
  let maxY = 0;
  const place = (n, left, d) => {
    const w = wid[n.id], ch = vis(n), y = d * (H + VG);
    depth[n.id] = d; maxY = Math.max(maxY, y + H); order.push(n);
    if (!ch.length) { pos[n.id] = { x: left + (w - W) / 2, y }; return; }
    const tot = ch.reduce((a, c) => a + wid[c.id], 0) + HG * (ch.length - 1);
    let cx = left + (w - tot) / 2;
    for (const c of ch) { place(c, cx, d + 1); cx += wid[c.id] + HG; edges.push([n.id, c.id]); }
    pos[n.id] = { x: (pos[ch[0].id].x + pos[ch[ch.length - 1].id].x) / 2, y };
  };
  let left = 0;
  for (const r of roots) { width(r); place(r, left, 0); left += wid[r.id] + RG; }
  return { pos, edges, order, kids, depth, w: Math.max(0, left - RG), h: maxY };
}
function descendants(id, kids) {
  const out = []; const walk = i => (kids[i] || []).forEach(c => { out.push(c.id); walk(c.id); });
  walk(id); return out;
}

/* ---------- Render ---------- */
function render() {
  renderSidebar();
  const mn = $('#mapName'); if (document.activeElement !== mn) mn.value = cur().name;
  renderLegend();
  renderCanvas();
  renderPanel();
  updUndo();
}

function renderSidebar() {
  $('#mapList').innerHTML = state.maps.map(m => {
    const people = m.nodes.filter(n => n.type !== 'team').length;
    const d = new Date(m.updatedAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    return `<div class="map-item ${m.id === state.currentId ? 'on' : ''}" data-map="${esc(m.id)}">
      <div class="t"><div class="nm">${esc(m.name) || 'Untitled map'}</div><div class="sub">${people} ${people === 1 ? 'person' : 'people'} · ${d}</div></div>
      <div class="mi-acts"><button data-mact="dup" title="Duplicate">Copy</button><button data-mact="del" title="Delete map">Delete</button></div>
    </div>`;
  }).join('');
}

function counts() {
  const c = {}; for (const n of cur().nodes) if (n.type !== 'team' && n.status) c[n.status] = (c[n.status] || 0) + 1;
  return c;
}
function renderLegend() {
  const c = counts(); const used = STATUSES.filter(s => s.k && c[s.k]);
  if (filterStatus && !c[filterStatus]) filterStatus = null;
  $('#legend').innerHTML = used.length ? '<span>Filter:</span>' + used.map(s =>
    `<button class="chip ${filterStatus === s.k ? 'on' : ''}" data-filter="${s.k}" style="--c:${s.c}"><i></i>${s.label} · ${c[s.k]}</button>`).join('') : '';
}

function matches(n) {
  if (filterStatus && n.status !== filterStatus) return false;
  if (query) { const h = (n.name + ' ' + n.title + ' ' + n.location + ' ' + str(n.notes)).toLowerCase(); if (!h.includes(query)) return false; }
  return true;
}

function renderCanvas() {
  refreshDupes();
  const m = cur(), L = layout(m, false); lastLayout = L;
  const filtering = !!(filterStatus || query);
  let paths = '';
  for (const [a, b] of L.edges) {
    const pa = L.pos[a], pb = L.pos[b], mid = pa.y + H + VG / 2;
    paths += `<path d="M${pa.x + W / 2},${pa.y + H}V${mid}H${pb.x + W / 2}V${pb.y}"/>`;
  }
  edgesEl.innerHTML = paths;
  edgesEl.setAttribute('width', Math.max(1, L.w)); edgesEl.setAttribute('height', Math.max(1, L.h));
  let html = '';
  for (const n of L.order) {
    const p = L.pos[n.id], st = SMAP[n.status] || SMAP[''];
    const kc = (L.kids[n.id] || []).length;
    const team = n.type === 'team';
    const url = !team && normUrl(n.url);
    const dim = filtering && !matches(n) && !dupIds.has(n.id);
    html += `<div class="card ${team ? 'team' : ''} ${sel === n.id ? 'sel' : ''} ${dim ? 'dim' : ''} ${dupIds.has(n.id) ? 'dupe' : ''}" data-id="${n.id}" style="left:${p.x}px;top:${p.y}px;--sc:${st.c};--sb:${st.bg}">
      ${!team && n.status ? '<div class="strip"></div>' : ''}
      ${hasNotes(n) ? `<span class="note-ic" title="${esc(n.notes.trim())}">${NOTE_SVG}</span>` : ''}
      <div class="nm" ${hasNotes(n) ? 'style="padding-right:18px"' : ''}>${esc(n.name) || `<span class="ph">${team ? 'Team name' : 'Name'}</span>`}</div>
      <div class="tt">${esc(n.title) || (team ? '' : '<span class="ph">Title</span>')}</div>
      <div class="ft"><span class="loc">${esc(n.location)}</span>${n.status && !team ? `<span class="badge">${st.label}</span>` : ''}${url ? `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener" title="Open profile">in&#8599;</a>` : ''}</div>
      <div class="acts"><button data-act="child" title="Add someone reporting to this box (Tab)">+ Report</button><button data-act="peer" title="Add a peer alongside (Enter)">+ Peer</button></div>
      ${kc ? `<button class="tog" data-act="toggle" title="${n.collapsed ? 'Expand' : 'Collapse'}">${n.collapsed ? '+' + descendants(n.id, L.kids).length : '&minus;'}</button>` : ''}
    </div>`;
  }
  cardsEl.innerHTML = html;
  $('#empty').classList.toggle('show', !L.order.length);
  renderTray();
  applyView();
}

function renderTray() {
  const up = cur().nodes.filter(n => n.unplaced);
  const filtering = !!(filterStatus || query);
  $('#tray').classList.toggle('closed', !state.trayOpen);
  $('#trayToggle .chev').innerHTML = state.trayOpen ? '&#9660;' : '&#9654;';
  const c = $('#trayCount'); c.textContent = up.length; c.classList.toggle('has', up.length > 0);
  $('#trayList').innerHTML = up.length ? up.map(n => {
    const st = SMAP[n.status] || SMAP[''];
    const sub = [n.title, n.location].filter(Boolean).join(' · ');

    return `<div class="titem ${sel === n.id ? 'sel' : ''} ${filtering && !matches(n) && !dupIds.has(n.id) ? 'dim' : ''} ${dupIds.has(n.id) ? 'dupe' : ''}" data-tid="${n.id}" style="--c:${n.status ? st.c : '#cbd5e1'}" title="${esc(tip)}">
      <i></i><div><div class="nm">${esc(n.name) || '<span class="ph">Name</span>'}</div><div class="tt">${esc(sub) || '&nbsp;'}</div></div>${hasNotes(n) ? `<span class="note-ic in-tray">${NOTE_SVG}</span>` : ''}</div>`;
  }).join('') : '<div class="tray-empty">No one waiting to be placed. Add people here when you’ve found them but don’t yet know where they sit.</div>';
}

const NOTE_SVG = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="1.5" y="1" width="9" height="10" rx="1.6" stroke="currentColor" stroke-width="1.2"/><path d="M3.8 4h4.4M3.8 6h4.4M3.8 8h2.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>';
function hasNotes(n) { return !!str(n.notes).trim(); }

/* ---------- Duplicate-name detection ---------- */
let dupIds = new Set();
// Lowercase, strip accents and punctuation: "José O'Neil" -> "jose o neil"
function normName(s) { return str(s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
// How the typed name q relates to an existing name k: 'same' | 'likely' (same first + last) | 'similar' (prefix while typing) | null
function nameRel(q, k) {
  if (!q || !k) return null;
  if (q === k) return 'same';
  const qa = q.split(' '), ka = k.split(' ');
  if (qa.length >= 2 && ka.length >= 2 && qa[0] === ka[0] && qa[qa.length - 1] === ka[ka.length - 1]) return 'likely';
  if (q.length >= 3 && (k.startsWith(q) || (qa.length === 1 && ka.some(w => w.startsWith(q))))) return 'similar';
  return null;
}
function findDupes(n) {
  const out = { here: [], other: [] };
  if (!n || n.type === 'team') return out;
  const q = normName(n.name); if (q.length < 2) return out;
  for (const o of cur().nodes) {
    if (o.id === n.id || o.type === 'team') continue;
    const r = nameRel(q, normName(o.name)); if (r) out.here.push({ o, r });
  }
  for (const m of state.maps) {
    if (m.id === state.currentId) continue;
    for (const o of m.nodes) {
      if (o.type === 'team') continue;
      const r = nameRel(q, normName(o.name)); if (r === 'same' || r === 'likely') out.other.push({ o, r, m });
    }
  }
  const rank = { same: 0, likely: 1, similar: 2 };
  out.here.sort((a, b) => rank[a.r] - rank[b.r]);
  return out;
}
function refreshDupes() { dupIds = new Set(findDupes(sel && node(sel)).here.map(x => x.o.id)); }
function dupRow(o, m) {
  const sub = m ? [o.title, 'on “' + (m.name || 'Untitled map') + '”'] : [o.title, o.unplaced ? 'Unplaced' : o.location];
  return `<div class="dup-row"><div class="dup-t"><b>${esc(o.name) || 'Unnamed'}</b><span>${esc(sub.filter(Boolean).join(' · ')) || '&nbsp;'}</span></div><button class="btn sm" data-goto="${esc(o.id)}" data-gmap="${m ? esc(m.id) : ''}">Show</button></div>`;
}
function dupBoxHTML(d) {
  const strong = d.here.filter(x => x.r !== 'similar'), sim = d.here.filter(x => x.r === 'similar');
  if (!d.here.length && !d.other.length) return '';
  let h = `<div class="dup ${strong.length || d.other.length ? 'warn' : 'soft'}">`;
  if (strong.length) h += `<div class="dup-h">Already on this map</div>` + strong.map(x => dupRow(x.o)).join('');
  if (sim.length) h += `<div class="dup-h">Similar names on this map</div>` + sim.slice(0, 4).map(x => dupRow(x.o)).join('') + (sim.length > 4 ? `<div class="dup-more">+${sim.length - 4} more</div>` : '');
  if (d.other.length) h += `<div class="dup-h">Also on other maps</div>` + d.other.slice(0, 4).map(x => dupRow(x.o, x.m)).join('');
  return h + '</div>';
}
// Groups of people on the current map who share a name (or first + last name)
function dupGroups() {
  const g = {};
  for (const n of cur().nodes) {
    if (n.type === 'team') continue;
    const t = normName(n.name).split(' ').filter(Boolean); if (!t.length) continue;
    const k = t.length >= 2 ? t[0] + ' ' + t[t.length - 1] : t[0];
    (g[k] = g[k] || []).push(n);
  }
  return Object.values(g).filter(a => a.length > 1);
}
// Select a person and make sure they're visible (switch map, open tray, expand collapsed managers)
function reveal(id, mapId) {
  if (mapId && mapId !== state.currentId) switchMap(mapId);
  const n = node(id); if (!n) return;
  if (n.unplaced) state.trayOpen = true;
  let p = n.parentId && node(n.parentId), changed = false;
  while (p) { if (p.collapsed) { p.collapsed = false; changed = true; } p = p.parentId && node(p.parentId); }
  if (changed) save();
  select(id);
  if (n.unplaced) { const t = $(`[data-tid="${id}"]`); if (t) t.scrollIntoView({ block: 'nearest' }); } else ensureVisible(id);
}

function statusButtons(n) {
  return STATUSES.map(s => `<button class="schip ${n.status === s.k ? 'on' : ''}" data-status="${s.k}" style="--c:${s.c};--b:${s.bg}"><i></i>${s.label}</button>`).join('');
}

  app.classList.toggle('panel-open', !!n);

    .map(o => `<option value="${o.id}" ${o.id === n.parentId ? 'selected' : ''}>${esc(o.name || (o.type === 'team' ? 'Unnamed team' : 'Unnamed'))}${o.title ? ' — ' + esc(o.title) : ''}</option>`).join('');
  const kidCount = (L.kids[n.id] || []).length;
  const url = normUrl(n.url);
  panel.innerHTML = `
    <div class="p-head"><div class="p-title">${up ? 'Unplaced person' : 'Edit box'}</div><button class="icon-btn" data-pa="close" title="Close (Esc)">&#10005;</button></div>
    <div class="seg"><button data-type="person" class="${team ? '' : 'on'}">Person</button><button data-type="team" class="${team ? 'on' : ''}">Team / group</button></div>
    <label class="fld"><span>${team ? 'Team name' : 'Name'}</span><input data-f="name" value="${esc(n.name)}" placeholder="${team ? 'e.g. Platform Engineering' : 'Full name'}" autocomplete="off"></label>
    <div id="dupBox">${dupBoxHTML(findDupes(n))}</div>
    <label class="fld"><span>${team ? 'Description' : 'Title'}</span><input data-f="title" value="${esc(n.title)}" placeholder="${team ? 'e.g. ~20 engineers, Berlin' : 'e.g. Head of Data'}" autocomplete="off"></label>
    ${team ? '' : `
    <label class="fld"><span>Location</span><input data-f="location" value="${esc(n.location)}" placeholder="City / office" autocomplete="off"></label>
    <div class="fld"><span>Profile URL</span><div class="row"><input data-f="url" value="${esc(n.url)}" placeholder="linkedin.com/in/…" autocomplete="off"><a id="openUrl" class="btn sm" target="_blank" rel="noopener" ${url ? `href="${esc(url)}"` : 'style="opacity:.4;pointer-events:none"'}>Open</a></div></div>
    <div class="fld"><span>Status</span><div class="stat-grid">${statusButtons(n)}</div></div>`}
    <label class="fld"><span>Notes</span><textarea data-f="notes" rows="4" placeholder="${team ? 'e.g. Hiring heavily in 2027; reorg rumoured' : 'e.g. Very strong reinforcement learning profile'}">${esc(n.notes)}</textarea></label>
    <label class="fld"><span>${up ? 'Place on map under' : 'Reports to'}</span><select data-pa="parent">
      <option value="__u" ${up ? 'selected' : ''}>— Unplaced (not on map yet) —</option>
      <option value="" ${!up && !n.parentId ? 'selected' : ''}>— Top level (no manager) —</option>${up ? opts.replace(/ selected/g, '') : opts}</select></label>
    <div class="divider"></div>
    ${up
      ? `<div class="btn-row"><button class="btn" data-pa="peer">+ Add another unplaced</button></div>`
      : `<div class="btn-row"><button class="btn" data-pa="child">+ Add report</button><button class="btn" data-pa="peer">+ Add peer</button></div>
    <div class="btn-row"><button class="btn" data-pa="left">&larr; Move left</button><button class="btn" data-pa="right">Move right &rarr;</button></div>
    <div class="btn-row"><button class="btn" data-pa="unplace" title="Take this box off the map and put it in the Unplaced tray">Move to Unplaced</button></div>`}
    <div class="btn-row">${kidCount
      ? `<button class="btn danger" data-pa="delKeep" title="Remove this box; its reports move up a level">Delete box only</button><button class="btn danger" data-pa="delAll">Delete with ${desc.size} below</button>`
      : `<button class="btn danger" data-pa="delAll">Delete</button>`}</div>
    <p class="hint">${up ? 'Tip: drag them from the Unplaced tray onto a box to place them under it.' : 'Tip: drag a box onto another box to change who it reports to, or into the Unplaced tray to take it off the map.'}</p>`;
}

function overviewHTML() {
  const m = cur(), people = m.nodes.filter(n => n.type !== 'team'), teams = m.nodes.length - people.length;
  const unpl = m.nodes.filter(n => n.unplaced).length;
  const c = counts(), groups = dupGroups();
  return `
    <div class="p-head"><div class="p-title">Map overview</div></div>
    <div class="stats"><div class="stat"><b>${people.length - unpl}</b><span>on the map</span></div><div class="stat"><b>${unpl}</b><span>unplaced</span></div><div class="stat"><b>${teams}</b><span>team boxes</span></div></div>
    ${groups.length ? `<div class="dup warn" style="margin:0 0 14px"><div class="dup-h">Possible duplicates (${groups.length})</div>${groups.map(g => g.map(n => dupRow(n)).join('')).join('<div class="dup-sep"></div>')}</div>` : ''}
    ${STATUSES.filter(s => s.k && c[s.k]).map(s => `<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0"><i style="width:9px;height:9px;border-radius:50%;background:${s.c}"></i><span style="flex:1">${s.label}</span><b>${c[s.k]}</b></div>`).join('')}
    <div class="divider"></div>
    <div class="btn-row"><button class="btn" data-pa="addPerson">+ Top-level person</button></div>
    <div class="btn-row"><button class="btn" data-pa="addTeam">+ Team box</button></div>
    <div class="btn-row"><button class="btn" data-pa="addUnplaced">+ Unplaced person</button></div>
    <div class="divider"></div>
    <div class="p-title" style="font-size:13px;margin-bottom:6px">Shortcuts (with a box selected)</div>
    <ul class="keys">
      <li><span>Add report</span><kbd>Tab</kbd></li>
      <li><span>Add peer</span><kbd>Enter</kbd></li>
      <li><span>Delete box</span><kbd>Delete</kbd></li>
      <li><span>Undo / Redo</span><span><kbd>⌘Z</kbd> <kbd>⇧⌘Z</kbd></span></li>
      <li><span>Fit map to screen</span><kbd>F</kbd></li>
      <li><span>Zoom</span><span>pinch or <kbd>⌘</kbd>+scroll</span></li>
    </ul>
    <div class="note">Your maps save automatically in this browser. Use <b>Save backup</b> now and then — clearing browser data or switching browsers will lose them otherwise.</div>`;
}

/* ---------- View ---------- */
function applyView() {
  stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  $('#zLbl').textContent = Math.round(view.k * 100) + '%';
  views[state.currentId] = { ...view };
}
function trayInset() { return state.trayOpen && vp.clientWidth > 640 ? $('#tray').offsetWidth + 12 : 0; }
function fit() {
  const L = lastLayout, r = vp.getBoundingClientRect(), inset = trayInset();
  if (!L || !L.order.length || !r.width) { view = { x: 40 + inset, y: 40, k: 1 }; return applyView(); }
  const pad = 50, aw = r.width - inset;
  const k = clamp(Math.min(1.1, (aw - pad * 2) / L.w, (r.height - pad * 2) / (L.h + 14)), 0.12, 1.1);
  view = { k, x: inset + (aw - L.w * k) / 2, y: Math.max(pad, (r.height - L.h * k) / 2) };
  applyView();
}
function zoomAt(f, cx, cy) {
  const k = clamp(view.k * f, 0.12, 2.5);
  const wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view = { k, x: cx - wx * k, y: cy - wy * k }; applyView();
}
function ensureVisible(id) {
  const p = lastLayout && lastLayout.pos[id]; if (!p) return;
  const r = vp.getBoundingClientRect(), m = 40;
  const sx = view.x + p.x * view.k, sy = view.y + p.y * view.k, sw = W * view.k, sh = H * view.k;
  const inset = trayInset();
  if (sx < m + inset || sy < m || sx + sw > r.width - m || sy + sh > r.height - m) {
    view.x = inset + (r.width - inset) / 2 - (p.x + W / 2) * view.k; view.y = r.height / 2 - (p.y + H / 2) * view.k; applyView();
  }
}

/* ---------- Actions ---------- */
function select(id) { sel = id; renderCanvas(); renderPanel(); }
function focusName() { const i = panel.querySelector('[data-f="name"]'); if (i) { i.focus(); i.select(); } }

function addNode(parentId, type, afterId, unplaced) {
  snap();
  const n = newNode({ parentId: unplaced ? null : (parentId || null), type: type || 'person', unplaced: !!unplaced });
  const nodes = cur().nodes;
  if (afterId) nodes.splice(nodes.findIndex(x => x.id === afterId) + 1, 0, n); else nodes.push(n);
  if (parentId && !unplaced) { const p = node(parentId); if (p) p.collapsed = false; }
  if (unplaced) state.trayOpen = true;
  sel = n.id; commit();
  if (unplaced) { const t = $(`[data-tid="${n.id}"]`); if (t) t.scrollIntoView({ block: 'nearest' }); } else ensureVisible(n.id);
  focusName();
}
const addUnplaced = afterId => addNode(null, 'person', afterId, true);
const addChild = id => { const n = node(id); if (n && n.unplaced) addUnplaced(id); else addNode(id, 'person'); };
const addPeer = id => { const n = node(id); if (!n) return; if (n.unplaced) addUnplaced(id); else addNode(n.parentId, n.type === 'team' ? 'team' : 'person', id); };

// Put an unplaced person onto the map (under pid, or top level if pid is null)
function place(id, pid) {
  const m = cur(), n = node(id); if (!n) return;
  snap();
  n.unplaced = false; n.parentId = pid || null;
  m.nodes = m.nodes.filter(x => x !== n); m.nodes.push(n);
  if (pid) node(pid).collapsed = false;
  commit(); ensureVisible(id);
  toast(pid ? `Placed ${n.name || 'person'} under ${node(pid).name || 'box'}` : `Placed ${n.name || 'person'} on the map (top level)`, 'Undo', undo);
}
// Take a box off the map; anyone reporting to it moves up to its manager
function unplace(id) {
  const m = cur(), n = node(id); if (!n || n.unplaced) return;
  snap();
  const moved = m.nodes.filter(c => c.parentId === id);
  moved.forEach(c => { c.parentId = n.parentId; });
  n.parentId = null; n.unplaced = true; n.collapsed = false;
  m.nodes = m.nodes.filter(x => x !== n); m.nodes.push(n);
  state.trayOpen = true;
  commit();
  toast(`Moved ${n.name || 'box'} to Unplaced` + (moved.length ? ` (${moved.length} report${moved.length === 1 ? '' : 's'} moved up)` : ''), 'Undo', undo);
}

function del(id, keepReports) {
  const n = node(id); if (!n) return;
  snap();
  const m = cur();
  if (keepReports) {
    m.nodes.forEach(c => { if (c.parentId === id) c.parentId = n.parentId; });
    m.nodes = m.nodes.filter(x => x.id !== id);
  } else {
    const gone = new Set([id, ...descendants(id, lastLayout.kids)]);
    m.nodes = m.nodes.filter(x => !gone.has(x.id));
  }
  sel = n.parentId && node(n.parentId) ? n.parentId : null;
  commit();
  toast(`Deleted ${n.name ? '“' + n.name + '”' : 'box'}`, 'Undo', undo);
}

function reparent(id, pid) {
  const m = cur(), n = node(id); if (!n) return;
  if (pid && (pid === id || descendants(id, layout(m, true).kids).includes(pid))) return;
  snap();
  n.parentId = pid || null;
  m.nodes = m.nodes.filter(x => x !== n); m.nodes.push(n);
  if (pid) node(pid).collapsed = false;
  commit(); ensureVisible(id);
}

function moveSib(id, dir) {
  const m = cur(), n = node(id);
  const eff = x => x.unplaced ? '__u' : (x.parentId && node(x.parentId)) ? x.parentId : null;
  const sibs = m.nodes.filter(x => eff(x) === eff(n));
  const i = sibs.indexOf(n), j = i + dir;
  if (i < 0 || j < 0 || j >= sibs.length) return;
  snap();
  const a = m.nodes.indexOf(n), b = m.nodes.indexOf(sibs[j]);
  [m.nodes[a], m.nodes[b]] = [m.nodes[b], m.nodes[a]];
  commit();
}

function switchMap(id) {
  if (saveT) save();
  state.currentId = id; sel = null; undoStack = []; redoStack = []; query = ''; filterStatus = null; $('#search').value = '';
  save(); render();
  if (views[id]) { view = { ...views[id] }; applyView(); } else fit();
  app.classList.remove('side-open');
}
function newMap() {
  const m = { id: uid(), name: 'New company', createdAt: Date.now(), updatedAt: Date.now(), nodes: [] };
  state.maps.unshift(m); switchMap(m.id);
  const i = $('#mapName'); i.focus(); i.select();
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg, actLabel, act) {
  toastEl.innerHTML = esc(msg) + (actLabel ? ` <button>${esc(actLabel)}</button>` : '');
  if (act) toastEl.querySelector('button').onclick = () => { act(); toastEl.classList.remove('show'); };
  toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 5000);
}

/* ---------- Pointer: pan, select, drag-to-reparent ---------- */
let drag = null;
vp.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (e.target.closest('button, a, input, .zoom, #empty .box')) return;
  const tItem = e.target.closest('.titem');
  if (e.target.closest('#tray') && !tItem) return;
  const card = !tItem && e.target.closest('.card');
  drag = { sx: e.clientX, sy: e.clientY, kind: tItem ? 'tray' : card ? 'card' : 'pan', el: tItem || card,
           id: tItem ? tItem.dataset.tid : card ? card.dataset.id : null, moved: false, vx: view.x, vy: view.y, target: null, overTray: false, overBg: false };
  vp.setPointerCapture(e.pointerId);
});
function clearDropMarks() {
  cardsEl.querySelectorAll('.drop').forEach(c => c.classList.remove('drop'));
  $('#tray').classList.remove('drop'); vp.classList.remove('over-bg');
}
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  if (!drag.moved) {
    drag.moved = true;
    if (drag.kind === 'card') { drag.el.classList.add('dragging'); drag.el.style.pointerEvents = 'none'; drag.bad = new Set([drag.id, ...descendants(drag.id, lastLayout.kids)]); }
    else if (drag.kind === 'tray') {
      drag.bad = new Set();
      drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('sel');
      document.body.appendChild(drag.ghost); drag.el.classList.add('src');
    } else vp.classList.add('panning');
  }
  if (drag.kind === 'pan') { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); return; }
  if (drag.kind === 'card') drag.el.style.transform = `translate(${dx / view.k}px,${dy / view.k}px)`;
  else { drag.ghost.style.left = (e.clientX - 30) + 'px'; drag.ghost.style.top = (e.clientY - 18) + 'px'; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const t = el && el.closest('.card');
  const tid = t && !drag.bad.has(t.dataset.id) ? t.dataset.id : null;
  const overTray = !!(el && el.closest('#tray'));
  const overBg = drag.kind === 'tray' && !tid && !overTray && !!(el && el.closest('#viewport'));
  if (tid !== drag.target || overTray !== drag.overTray || overBg !== drag.overBg) {
    clearDropMarks();
    drag.target = tid; drag.overTray = overTray; drag.overBg = overBg;
    if (t && tid) t.classList.add('drop');
    if (overTray && drag.kind === 'card') $('#tray').classList.add('drop');
    if (overBg) vp.classList.add('over-bg');
  }
});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null; vp.classList.remove('panning'); clearDropMarks();
  if (d.ghost) d.ghost.remove();
  if (!d.moved) { select(d.id || null); return; }
  if (d.kind === 'card') {
    const n = node(d.id);
    if (d.overTray) { unplace(d.id); return; }
    if (d.target && n && n.parentId !== d.target) { reparent(d.id, d.target); toast('Moved under ' + (node(d.target).name || 'box'), 'Undo', undo); }
    else renderCanvas();
  } else if (d.kind === 'tray') {
    if (d.target) place(d.id, d.target);
    else if (d.overBg) place(d.id, null);
    else renderTray();
  }
}
vp.addEventListener('pointerup', endDrag);
vp.addEventListener('pointercancel', () => { if (drag) { if (drag.ghost) drag.ghost.remove(); drag = null; clearDropMarks(); renderCanvas(); } });
$('#trayToggle').onclick = () => { state.trayOpen = !state.trayOpen; save(); renderTray(); };
$('#trayAdd').onclick = () => addUnplaced();
vp.addEventListener('dblclick', e => { const c = e.target.closest('.card, .titem'); if (c && !e.target.closest('button,a')) { select(c.dataset.id || c.dataset.tid); focusName(); } });
vp.addEventListener('wheel', e => {
  if (e.target.closest('#tray') && !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
}, { passive: false });

cardsEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.card').dataset.id;
  if (b.dataset.act === 'child') addChild(id);
  else if (b.dataset.act === 'peer') addPeer(id);
  else if (b.dataset.act === 'toggle') { const n = node(id); n.collapsed = !n.collapsed; save(); renderCanvas(); renderPanel(); }
});

$('#zIn').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
$('#zOut').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };
$('#zFit').onclick = fit;
document.querySelectorAll('[data-empty]').forEach(b => b.onclick = () => addNode(null, b.dataset.empty));
$('#addRoot').onclick = () => addNode(null, 'person');

/* ---------- Panel events ---------- */
panel.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  const n = node(sel); if (!n) return;
  if (!editSnap) { snap(); editSnap = true; }
  n[f] = e.target.value;
  if (f === 'url') { const a = $('#openUrl'), u = normUrl(n.url); if (a) { if (u) { a.href = u; a.style.cssText = ''; } else { a.removeAttribute('href'); a.style.cssText = 'opacity:.4;pointer-events:none'; } } }
  if (f === 'name') { refreshDupes(); const box = $('#dupBox'); if (box) box.innerHTML = dupBoxHTML(findDupes(n)); }
  renderCanvas(); renderLegend(); queueSave();
});
panel.addEventListener('focusout', () => { editSnap = false; });
panel.addEventListener('change', e => {
  if (e.target.dataset.pa !== 'parent') return;
  const n = node(sel), v = e.target.value; if (!n) return;
  if (v === '__u') unplace(sel);
  else if (n.unplaced) place(sel, v || null);
  else reparent(sel, v || null);
});
panel.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.goto) { reveal(t.dataset.goto, t.dataset.gmap || null); return; }
  const n = sel && node(sel);
  if (t.dataset.status !== undefined && n) { snap(); n.status = t.dataset.status; commit(); return; }
  if (t.dataset.type && n) { if (n.type !== t.dataset.type) { snap(); n.type = t.dataset.type; commit(); } return; }
  switch (t.dataset.pa) {
    case 'close': select(null); break;
    case 'child': addChild(sel); break;
    case 'peer': addPeer(sel); break;
    case 'left': moveSib(sel, -1); break;
    case 'right': moveSib(sel, 1); break;
    case 'delKeep': del(sel, true); break;
    case 'delAll': del(sel, false); break;
    case 'addPerson': addNode(null, 'person'); break;
    case 'addTeam': addNode(null, 'team'); break;
    case 'addUnplaced': addUnplaced(); break;
    case 'unplace': unplace(sel); break;
  }
});

/* ---------- Top bar & sidebar ---------- */
$('#mapName').addEventListener('input', e => { cur().name = e.target.value; queueSave(); renderSidebar(); });
$('#mapName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderCanvas(); });
$('#legend').addEventListener('click', e => { const c = e.target.closest('[data-filter]'); if (!c) return; filterStatus = filterStatus === c.dataset.filter ? null : c.dataset.filter; renderLegend(); renderCanvas(); });
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#newMap').onclick = newMap;
$('#toggleSide').onclick = () => app.classList.toggle('side-open');
$('#scrim').onclick = () => app.classList.remove('side-open');
$('#mapList').addEventListener('click', e => {
  const it = e.target.closest('[data-map]'); if (!it) return;
  const id = it.dataset.map, a = e.target.closest('[data-mact]');
  if (!a) { if (id !== state.currentId) switchMap(id); return; }
  const m = state.maps.find(x => x.id === id);
  if (a.dataset.mact === 'dup') {
    const c = cleanMap(JSON.parse(JSON.stringify(m))); c.id = uid(); c.name = m.name + ' (copy)'; c.createdAt = c.updatedAt = Date.now();
    const remap = {}; c.nodes.forEach(n => { remap[n.id] = uid(); });
    c.nodes.forEach(n => { n.id = remap[n.id]; if (n.parentId) n.parentId = remap[n.parentId] || null; });
    state.maps.splice(state.maps.indexOf(m) + 1, 0, c); switchMap(c.id);
  } else if (a.dataset.mact === 'del') {
    if (!confirm(`Delete the map “${m.name}”? This can’t be undone (unless you have a backup).`)) return;
    state.maps = state.maps.filter(x => x !== m);
    if (!state.maps.length) { const nm = { id: uid(), name: 'New company', createdAt: Date.now(), updatedAt: Date.now(), nodes: [] }; state.maps.push(nm); }
    switchMap(state.maps.some(x => x.id === state.currentId) ? state.currentId : state.maps[0].id);
  }
});

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  const inField = e.target.matches('input, textarea, select');
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z' && !inField) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y' && !inField) { e.preventDefault(); redo(); return; }
  if (e.key === 'Escape') { $('#exportMenu').classList.remove('open'); if (inField) e.target.blur(); else select(null); return; }
  if (inField) {
    // Enter finishes a single-line field; in Notes, Enter is a new line and ⌘/Ctrl+Enter finishes
    if (e.key === 'Enter' && e.target.dataset.f && (e.target.tagName === 'INPUT' || mod)) { e.preventDefault(); e.target.blur(); }
    return;
  }
  if (mod || e.altKey) return;
  if (k === 'f') { fit(); return; }
  if (!sel) return;
  if (e.key === 'Tab') { e.preventDefault(); addChild(sel); }
  else if (e.key === 'Enter') { e.preventDefault(); addPeer(sel); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(sel, false); }
});

/* ---------- Backup / restore ---------- */
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function slug(s) { return (str(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'talent-map'); }
function today() { return new Date().toISOString().slice(0, 10); }

$('#backupBtn').onclick = () => {
  if (saveT) save();
  const data = { app: 'talent-map', version: 1, exportedAt: new Date().toISOString(), maps: state.maps };
  download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `talent-maps-backup-${today()}.json`);
  toast(`Backup saved (${state.maps.length} map${state.maps.length === 1 ? '' : 's'})`);
};
$('#restoreBtn').onclick = () => $('#fileIn').click();
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch (err) { toast('That file isn’t valid JSON'); return; }
  const raw = Array.isArray(data?.maps) ? data.maps : (Array.isArray(data?.nodes) ? [data] : null);
  if (!raw || !raw.length) { toast('No maps found in that file'); return; }
  const incoming = raw.map(cleanMap);
  const clashes = incoming.filter(m => state.maps.some(x => x.id === m.id));
  let overwrite = false;
  if (clashes.length) overwrite = confirm(`${clashes.length} of these maps already exist here.\n\nOK = replace them with the versions in the file\nCancel = import them as separate copies`);
  for (const m of incoming) {
    const i = state.maps.findIndex(x => x.id === m.id);
    if (i >= 0 && overwrite) state.maps[i] = m;
    else { if (i >= 0) { m.id = uid(); m.name += ' (imported)'; } state.maps.push(m); }
  }
  save(); switchMap(incoming[0].id);
  toast(`Loaded ${incoming.length} map${incoming.length === 1 ? '' : 's'}`);
});

const PADX = 36, PADY = 30, HEAD = 92;
const UP_GAP = 52, UP_HEAD = 32;
const NOTE_GAP = 52, NOTE_HEAD = 32, NOTE_LH = 14.5;
// d = an adapter, used only to measure text so notes can be wrapped
function exportDims(L, m, d) {
  const cw = Math.max(L.w, 560) + PADX * 2;
  const up = m.nodes.filter(n => n.unplaced);
  const cols = Math.max(1, Math.floor((cw - PADX * 2 + HG) / (W + HG)));
  const rows = Math.ceil(up.length / cols);
  const upH = up.length ? (L.h ? UP_GAP : 0) + UP_HEAD + rows * H + (rows - 1) * HG : 0;
  // Notes: numbered in the same order as the chart, then unplaced
  const nums = {}, notes = [];
  for (const n of [...L.order, ...up]) {
    if (!str(n.notes).trim()) continue;
    const num = notes.length + 1; nums[n.id] = num;
    const head = `${num}.  ${n.name || (n.type === 'team' ? 'Unnamed team' : 'Unnamed')}${n.title ? ' — ' + n.title : ''}${n.unplaced ? '  (unplaced)' : ''}`;
    const lines = [];
    str(n.notes).trim().split(/\r?\n/).forEach(par => { if (!par.trim()) lines.push(''); else lines.push(...wrapText(d, par, 10.5, false, cw - PADX * 2 - 20, 400)); });
    notes.push({ head: fitText(d, head, 11, true, cw - PADX * 2), lines });
  }
  const notesH = notes.length ? ((L.h || up.length) ? NOTE_GAP : 0) + NOTE_HEAD + notes.reduce((a, e) => a + 16 + e.lines.length * NOTE_LH + 10, 0) - 10 : 0;
  return { cw, ch: L.h + upH + notesH + HEAD + PADY * 2 + 4, up, cols, upH, nums, notes };
}

function fitText(d, s, size, bold, max) {
  s = str(s); if (d.measure(s, size, bold) <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (d.measure(s.slice(0, mid).trimEnd() + '…', size, bold) <= max) lo = mid; else hi = mid - 1; }
  return s.slice(0, lo).trimEnd() + '…';
}
function wrapText(d, s, size, bold, max, maxLines) {
  const words = str(s).split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (let i = 0; i < words.length; i++) {
    const t = line ? line + ' ' + words[i] : words[i];
    if (d.measure(t, size, bold) <= max || !line) { line = t; continue; }
    lines.push(line); line = words[i];
    if (lines.length === maxLines - 1) { line = words.slice(i).join(' '); break; }
  }
  if (line) lines.push(line);
  return lines.slice(0, maxLines).map((l, i) => i === maxLines - 1 || d.measure(l, size, bold) > max ? fitText(d, l, size, bold, max) : l);
}

function drawAll(d, m, L) {
  const { cw, ch, up, cols, upH, nums, notes } = exportDims(L, m, d);
  d.rect(0, 0, cw, ch, 0, '#ffffff');
  d.text(fitText(d, m.name || 'Untitled map', 20, true, cw - PADX * 2), PADX, PADY + 20, 20, true, '#0f172a');
  const people = m.nodes.filter(n => n.type !== 'team').length;
  const date = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  d.text(`${people} ${people === 1 ? 'person' : 'people'} · ${date}`, PADX, PADY + 40, 11, false, '#64748b');
  const c = counts(); let lx = PADX;
  for (const s of STATUSES) {
    if (!s.k || !c[s.k]) continue;
    const label = `${s.label} (${c[s.k]})`, tw = d.measure(label, 10, false);
    if (lx + tw + 30 > cw - PADX) break;
    d.rect(lx, PADY + 54, 8, 8, 4, s.c);
    d.text(label, lx + 13, PADY + 61.5, 10, false, '#475569');
    lx += tw + 30;
  }
  const ox = PADX + (cw - PADX * 2 - L.w) / 2, oy = PADY + HEAD;
  for (const [a, b] of L.edges) {
    const pa = L.pos[a], pb = L.pos[b], mid = pa.y + H + VG / 2;
    d.poly([[ox + pa.x + W / 2, oy + pa.y + H], [ox + pa.x + W / 2, oy + mid], [ox + pb.x + W / 2, oy + mid], [ox + pb.x + W / 2, oy + pb.y]], '#94a3b8', 1.25);
  }
  for (const n of L.order) { const p = L.pos[n.id]; drawCard(d, n, ox + p.x, oy + p.y, nums[n.id]); }
  if (up.length) {
    let y0 = oy + L.h;
    if (L.h) { y0 += UP_GAP; d.poly([[PADX, y0 - UP_GAP / 2], [cw - PADX, y0 - UP_GAP / 2]], '#e2e8f0', 1); }
    d.text(`Unplaced — not yet positioned (${up.length})`, PADX, y0 + 14, 13, true, '#92400e');
    up.forEach((n, i) => drawCard(d, n, PADX + (i % cols) * (W + HG), y0 + UP_HEAD + Math.floor(i / cols) * (H + HG), nums[n.id]));
  }
  if (notes.length) {
    let y = oy + L.h + upH;
    if (L.h || up.length) { y += NOTE_GAP; d.poly([[PADX, y - NOTE_GAP / 2], [cw - PADX, y - NOTE_GAP / 2]], '#e2e8f0', 1); }
    d.text('Notes', PADX, y + 14, 13, true, '#0f172a');
    y += NOTE_HEAD;
    for (const e of notes) {
      d.text(e.head, PADX, y + 11, 11, true, '#0f172a');
      y += 16;
      e.lines.forEach((l, i) => { if (l) d.text(l, PADX + 20, y + 10 + i * NOTE_LH, 10.5, false, '#334155'); });
      y += e.lines.length * NOTE_LH + 10;
    }
  }
}

function drawNoteMark(d, num, x, y, dark) {
  const label = String(num), w = Math.max(16, d.measure(label, 9, true) + 9);
  d.rect(x + W - w - 7, y + 7, w, 16, 8, dark ? '#334155' : '#e2e8f0');
  d.text(label, x + W - 7 - w / 2, y + 18.2, 9, true, dark ? '#ffffff' : '#334155', 'center');
}
function drawCard(d, n, x, y, num) {
  if (n.type === 'team') {
    d.rect(x, y, W, H, 10, '#1e293b');
    if (num) drawNoteMark(d, num, x, y, true);
    const nm = fitText(d, n.name || 'Team', 14, true, W - (num ? 64 : 24));
    const ds = n.title ? fitText(d, n.title, 11, false, W - 24) : '';
    const cy = y + H / 2 + (ds ? -3 : 5);
    d.text(nm, x + W / 2, cy, 14, true, '#ffffff', 'center');
    if (ds) d.text(ds, x + W / 2, cy + 17, 11, false, '#cbd5e1', 'center');
    return;
  }
  const st = SMAP[n.status] || SMAP[''];
  d.rect(x, y, W, H, 10, '#ffffff', '#cbd5e1', 1);
  if (n.status) d.rect(x + 7, y + 10, 4, H - 20, 2, st.c);
  const tx = x + 18, mw = W - 28;
  if (num) drawNoteMark(d, num, x, y, false);
  d.text(fitText(d, n.name || 'Unnamed', 13.5, true, mw - (num ? 26 : 0)), tx, y + 25, 13.5, true, '#0f172a');
  wrapText(d, n.title, 11.5, false, mw, 2).forEach((l, i) => d.text(l, tx, y + 42 + i * 14, 11.5, false, '#475569'));
  let bx = x + W - 10;
  if (n.status) {
    const tw = d.measure(st.label, 9.5, true), pw = tw + 14;
    d.rect(bx - pw, y + H - 23, pw, 16, 8, st.bg);
    d.text(st.label, bx - pw + 7, y + H - 11.8, 9.5, true, st.c);
    bx -= pw + 6;
  }
  if (n.location) d.text(fitText(d, n.location, 10.5, false, bx - tx), tx, y + H - 11.5, 10.5, false, '#64748b');
  const u = normUrl(n.url); if (u) d.link(x, y, W, H, u);
}

function canvasAdapter(ctx) {
  const font = (s, b) => `${b ? '600' : '400'} ${s}px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif`;
  const rr = (x, y, w, h, r) => {
    ctx.beginPath();
    if (!r) { ctx.rect(x, y, w, h); return; }
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  };
  return {
    rect(x, y, w, h, r, fill, stroke, lw) { rr(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); } },
    poly(pts, color, lw) { ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); },
    text(s, x, y, size, bold, color, align) { ctx.font = font(size, bold); ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); },
    measure(s, size, bold) { ctx.font = font(size, bold); return ctx.measureText(s).width; },
    link() {}
  };
}

function pdfAdapter(doc, s, ox, oy) {
  const X = v => ox + v * s, Y = v => oy + v * s;
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  doc.setLineCap('round'); doc.setLineJoin('round');
  return {
    rect(x, y, w, h, r, fill, stroke, lw) {
      if (fill) doc.setFillColor(...rgb(fill));
      if (stroke) { doc.setDrawColor(...rgb(stroke)); doc.setLineWidth((lw || 1) * s); }
      const style = fill && stroke ? 'FD' : fill ? 'F' : 'S';
      if (r > 0) doc.roundedRect(X(x), Y(y), w * s, h * s, r * s, r * s, style); else doc.rect(X(x), Y(y), w * s, h * s, style);
    },
    poly(pts, color, lw) {
      doc.setDrawColor(...rgb(color)); doc.setLineWidth(lw * s);
      for (let i = 1; i < pts.length; i++) doc.line(X(pts[i - 1][0]), Y(pts[i - 1][1]), X(pts[i][0]), Y(pts[i][1]));
    },
    text(t, x, y, size, bold, color, align) {
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size * s); doc.setTextColor(...rgb(color));
      doc.text(t, X(x), Y(y), { align: align || 'left', baseline: 'alphabetic' });
    },
    measure(t, size, bold) { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size * s); return doc.getTextWidth(t) / s; },
    link(x, y, w, h, url) { doc.link(X(x), Y(y), w * s, h * s, { url }); }
  };
}

function exportPNG() {
  const m = cur(), L = layout(m, true), { cw, ch } = exportDims(L, m, canvasAdapter(document.createElement('canvas').getContext('2d')));
  const sc = Math.max(0.5, Math.min(2, 16000 / cw, 16000 / ch, Math.sqrt(1.4e8 / (cw * ch))));
  const cv = document.createElement('canvas'); cv.width = Math.round(cw * sc); cv.height = Math.round(ch * sc);
  const ctx = cv.getContext('2d'); ctx.scale(sc, sc);
  drawAll(canvasAdapter(ctx), m, L);
  cv.toBlob(b => { if (!b) { toast('Map too large for a PNG — try PDF'); return; } download(b, `${slug(m.name)}-${today()}.png`); toast('PNG exported'); }, 'image/png');
}

function exportPDF() {
  if (!window.jspdf) { toast('PDF library didn’t load — check your internet connection and reload'); return; }
  const m = cur(), L = layout(m, true), { cw, ch } = exportDims(L, m, pdfAdapter(new window.jspdf.jsPDF({ unit: 'pt' }), 1, 0, 0));
  const land = cw >= ch, sizes = { a4: [842, 595], a3: [1191, 842], a2: [1684, 1191], a1: [2384, 1684], a0: [3370, 2384] };
  let fmt, pw, ph, s;
  for (const k of Object.keys(sizes)) {
    [pw, ph] = land ? sizes[k] : [sizes[k][1], sizes[k][0]];
    fmt = k; s = Math.min((pw - 40) / cw, (ph - 40) / ch, 1);
    if (s >= 0.6) break;
  }
  const doc = new window.jspdf.jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'pt', format: fmt });
  doc.setProperties({ title: m.name || 'Talent map', creator: 'Talent Map' });
  drawAll(pdfAdapter(doc, s, (pw - cw * s) / 2, (ph - ch * s) / 2), m, L);
  doc.save(`${slug(m.name)}-${today()}.pdf`);
  toast(`PDF exported (${fmt.toUpperCase()} ${land ? 'landscape' : 'portrait'})`);
}

function exportCSV() {
  const m = cur(), L = layout(m, true);
  const byId = new Map(m.nodes.map(n => [n.id, n]));
  const rows = [['Name', 'Title', 'Type', 'Status', 'Location', 'Profile URL', 'Placement', 'Reports to', 'Level', 'Reporting line', 'Notes']];
  for (const n of L.order) {
    const chain = []; let p = n.parentId && byId.get(n.parentId);
    while (p) { chain.unshift(p.name || '(unnamed)'); p = p.parentId && byId.get(p.parentId); }
    rows.push([n.name, n.title, n.type === 'team' ? 'Team' : 'Person', n.status ? SMAP[n.status].label : '', n.location, normUrl(n.url), 'On map',
      n.parentId && byId.get(n.parentId) ? byId.get(n.parentId).name : '', L.depth[n.id] + 1, chain.join(' > '), str(n.notes).trim()]);
  }
  for (const n of m.nodes.filter(x => x.unplaced)) {
    rows.push([n.name, n.title, n.type === 'team' ? 'Team' : 'Person', n.status ? SMAP[n.status].label : '', n.location, normUrl(n.url), 'Unplaced', '', '', '', str(n.notes).trim()]);
  }
  const csv = rows.map(r => r.map(v => { v = str(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  download(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), `${slug(m.name)}-${today()}.csv`);
  toast('CSV exported');
}

/* ---------- Boot ---------- */
if (state.trayOpen === undefined) state.trayOpen = window.innerWidth > 700;
render();
save();
requestAnimationFrame(fit);
window.addEventListener('resize', () => { if (!views[state.currentId]) fit(); });
})();
</script>
</body>
